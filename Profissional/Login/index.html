<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Profissional | Luana Damazio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-wrapper">
                    <img src="../assets/logoluana.jpeg" alt="Logo Luana Damazio" class="login-logo">
                </div>
                <h1>Painel do Profissional</h1>
                <p>Acesse sua conta para gerenciar seus atendimentos.</p>
            </div>

            <form>
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu email" required>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Digite sua senha" required>
                </div>

                <div class="login-options">
                    <label><input type="checkbox"> Lembrar de mim</label>
                    <a href="../Esqueceu-Senha/index.html">Esqueceu a senha?</a>
                </div>

                <a class="btn-login">Entrar no Sistema</a>
            </form>
        </div>
    </div>

</body>
</html>
