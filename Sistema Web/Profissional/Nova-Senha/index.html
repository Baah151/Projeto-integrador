<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definir Nova Senha | Luana Damazio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>

    <div id="error-toast" class="toast">
        <span class="material-symbols-outlined">error</span>
        <span id="error-message">As senhas não coincidem!</span>
    </div>

    <div class="reset-wrapper">
        <div class="reset-card">
            <div class="reset-header">
                <div class="logo-wrapper">
                    <img src="../assets/logoluana.jpeg" alt="Logo Luana Damazio" class="reset-logo">
                </div>
                <h1>Criar Nova Senha</h1>
                <p>Defina uma senha forte e segura para garantir a proteção do seu acesso administrativo.</p>
            </div>

            <form id="form-nova-senha">
                <div class="input-group">
                    <label for="password">Nova Senha</label>
                    <div class="password-field">
                        <input type="password" id="password" placeholder="Digite a nova senha" required>
                        <span class="material-symbols-outlined toggle-pass" onclick="togglePass('password')">visibility_off</span>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirmar Nova Senha</label>
                    <div class="password-field">
                        <input type="password" id="confirm-password" placeholder="Repita a senha" required>
                        <span class="material-symbols-outlined toggle-pass" onclick="togglePass('confirm-password')">visibility_off</span>
                    </div>
                </div>

                <button type="submit" class="btn-reset">Redefinir Senha</button>
            </form>

            <div class="reset-footer">
                <a href="../login/index.html">Cancelar e Voltar</a>
            </div>
        </div>
    </div>

    <script src="../assets/api.js"></script>
    <script src="script.js"></script>
</body>
</html>
