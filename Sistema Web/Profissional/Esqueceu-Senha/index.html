<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha | Luana Damazio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="recovery-wrapper">
        <div class="recovery-card">
            <div class="recovery-header">
                <div class="logo-wrapper">
                    <img src="../assets/logoluana.jpeg" alt="Logo Luana Damazio" class="recovery-logo">
                </div>
                <h1>Recuperar Senha</h1>
                <p>Insira seu e-mail cadastrado e enviaremos um link para você criar uma nova senha.</p>
            </div>

            <form id="form-recuperar-senha">
                <div class="input-group">
                    <label for="email">E-mail Profissional</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>

                <button type="submit" class="btn-recovery">Enviar Instruções</button>
            </form>

            <div class="recovery-footer">
                <a href="../login/index.html">← Voltar para o Login</a>
            </div>
        </div>
    </div>

    <script src="../assets/api.js"></script>
    <script src="script.js"></script>
</body>
</html>
