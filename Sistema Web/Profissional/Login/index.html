<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Profissional | Luana Damazio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>

    <div class="login-wrapper">
        <div class="login-side-image">
            <div class="welcome-text-wrapper">
                <h2>Bem-vinda, Luana Damazio!</h2>
                <p>Acesse o painel para gerenciar seus atendimentos, evoluções clínicas e acompanhar seus pacientes.</p>
            </div>
        </div>

        <div class="login-side-form">
            <div class="login-card">
                <div class="login-header">
                    <div class="logo-wrapper">
                        <img src="../assets/logoluana.jpeg" alt="Logo Luana Damazio" class="login-logo">
                    </div>
                    <h1>Painel do Profissional</h1>
                    <p>Insira suas credenciais de acesso administrativas.</p>
                </div>

                <form id="form-login-profissional">
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="Digite seu email" required>
                    </div>

                    <div class="input-group password-wrapper">
                        <label for="password">Senha</label>
                        <div class="input-container">
                            <input type="password" id="password" placeholder="Digite sua senha" required>
                            <span class="material-symbols-outlined eye-icon">visibility</span>
                        </div>
                    </div>

                    <div class="login-options">
                        <label><input type="checkbox"> Lembrar de mim</label>
                        <a href="../Esqueceu-Senha/index.html">Esqueceu a senha?</a>
                    </div>

                    <button type="submit" class="btn-login">Entrar no Sistema</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
