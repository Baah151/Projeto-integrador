<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Paciente | Luana Damazio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

    <div class="cadastro-container">
        <a href="../pacientes/index.html" class="btn-back">
            <span class="material-symbols-outlined">arrow_back</span>
            Voltar para Pacientes
        </a>

        <div class="topbar">
            <h1>Cadastrar Novo Paciente</h1>
            <p>Registre manualmente os dados de pacientes com dificuldades de acesso tecnológico.</p>
        </div>

        <section class="form-card">
            <form action="index.html">
                <div class="form-section">
                    <h4>Dados Pessoais</h4>
                    <div class="input-row">
                        <div class="input-group">
                            <label>Nome Completo</label>
                            <input type="text" placeholder="Ex: Nome do Paciente" required>
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label>CPF</label>
                            <input type="text" placeholder="000.000.000-00" required>
                        </div>
                        <div class="input-group">
                            <label>Data de Nascimento</label>
                            <input type="date" required>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h4>Informações de Contato</h4>
                    <div class="input-row">
                        <div class="input-group">
                            <label>Telefone / WhatsApp</label>
                            <input type="text" placeholder="(00) 00000-0000" required>
                        </div>
                        <div class="input-group">
                            <label>E-mail</label>
                            <input type="email" placeholder="exemplo@email.com">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h4>Acesso ao Sistema</h4>
                    <div class="input-row">
                        <div class="input-group">
                            <label>Criar Senha Inicial</label>
                            <input type="password" placeholder="Digite uma senha">
                        </div>
                        <div class="input-group">
                            <label>Repetir Senha</label>
                            <input type="password" placeholder="Confirmar senha">
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="index.html" class="btn-cancel-cadastro">Cancelar</a>
                    <button type="submit" class="btn-submit-cadastro">Salvar Cadastro</button>
                </div>
            </form>
        </section>
    </div>

</body>
</html>
