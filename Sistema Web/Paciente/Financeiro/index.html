<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro | Luana Damazio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

    <div class="container">
        
        <header class="mobile-header">
            <button class="menu-toggle-btn" id="open-menu-btn">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <span class="mobile-page-title">Financeiro</span>
            <div class="mobile-logo">
                <img src="../assets/logoluana.jpeg" alt="Logo">
            </div>
        </header>

        <aside class="sidebar" id="mobile-sidebar">
            <div class="sidebar-top-wrapper">
                <div class="logo">
                    <img src="../assets/logoluana.jpeg" alt="Logo">
                </div>
                <button class="close-menu-btn" id="close-menu-btn">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <nav>
                <a href="../agendamento/index.html">
                    <span class="material-symbols-outlined">calendar_add_on</span> Agendamento
                </a>
                <a href="../minhas-consultas/index.html" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span class="material-symbols-outlined">event_note</span> Minhas Consultas
                    </div>
                    <span class="menu-badge" id="consultas-notif-badge" style="display: none;">0</span>
                </a>
                <a href="../documentos/index.html" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span class="material-symbols-outlined">folder_shared</span> Documentos
                    </div>
                    <span class="menu-badge" id="menu-notif-badge" style="display: none;">0</span>
                </a>
                <a href="../financeiro/index.html" class="active">
                    <span class="material-symbols-outlined">payments</span> Financeiro
                </a>

                <a href="../perfil/index.html">
                    <span class="material-symbols-outlined">person</span> Perfil
                </a>
                <a href="../contatos/index.html">
                    <span class="material-symbols-outlined">call</span> Contatos
                </a>
            </nav>
            <div class="logout">
                <a href="../login/index.html">Sair</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <h1>Financeiro</h1>
                <p>Consulte o histórico de pagamentos das sessões finalizadas.</p>
            </div>

            <section class="finance-controls">
                <div class="summary-card">
                    <span class="material-symbols-outlined">check_circle</span>
                    <div>
                        <p>Sessões Pagas</p>
                        <h3 id="total-pagas">0</h3>
                    </div>
                </div>
                <div class="filter-group">
                    <input type="month" id="finance-filter" onchange="filtrarFinanceiro()">
                </div>
            </section>

            <section class="table-wrapper">
                <div class="finance-header">
                    <span>Data</span>
                    <span>Serviço</span>
                    <span>Valor</span>
                    <span>Status</span>
                    <span style="text-align: center;">Ação</span>
                </div>
                <div id="finance-list">
                </div>
            </section>
        </main>
    </div>

    <div class="menu-overlay-backdrop" id="menu-backdrop"></div>

    <script src="../assets/api.js"></script>
    <script src="script.js"></script>
</body>
</html>
