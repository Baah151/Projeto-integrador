<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Luana Damazio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="left-side">
            <div class="overlay"></div>
            <div class="content">
                <h1>Bem-vindo(a)</h1>
                <p>Crie sua conta para agendar consultas, acompanhar atendimentos e cuidar da sua saúde com mais praticidade.</p>
            </div>
        </div>

        <div class="right-side">
            <div class="register-form">
                <h2>Criar Conta</h2>

                <div class="steps-nav">
                    <div class="step-item active" id="step-tab-1">Registro</div>
                    <div class="step-item" id="step-tab-2">Contato</div>
                    <div class="step-item" id="step-tab-3">Endereço</div>
                </div>

                <form id="form-cadastro">
                    <div class="form-step active" id="step-1">
                        <div class="input-group">
                            <label for="nome">Nome Completo</label>
                            <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                        </div>

                        <div class="input-group">
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
                        </div>

                        <div class="input-group">
                            <label for="nascimento">Data de Nascimento</label>
                            <input type="text" id="nascimento" placeholder="DD/MM/AAAA" maxlength="10" required>
                        </div>

                        <div class="step-actions">
                            <button type="button" class="btn-next">Próximo passo</button>
                        </div>
                    </div>

                    <div class="form-step" id="step-2">
                        <div class="input-group">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" placeholder="Digite seu e-mail" required>
                        </div>

                        <div class="input-group">
                            <label for="telefone">Telefone / WhatsApp</label>
                            <input type="tel" id="telefone" placeholder="(00) 00000-0000" maxlength="15" required>
                        </div>

                        <div class="input-row">
                            <div class="input-group">
                                <label for="senha">Criar Senha</label>
                                <div class="password-wrapper">
                                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                                    <button type="button" id="toggleSenha" class="toggle-button">
                                        <svg class="eye-icon" id="eye-senha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
                                    </button>
                                </div>
                            </div>

                            <div class="input-group">
                                <label for="confirmar-senha">Confirmar Senha</label>
                                <div class="password-wrapper">
                                    <input type="password" id="confirmar-senha" placeholder="Repita a senha" required>
                                    <button type="button" id="toggleConfirmar" class="toggle-button">
                                        <svg class="eye-icon" id="eye-confirmar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="step-actions">
                            <button type="button" class="btn-prev">Voltar</button>
                            <button type="button" class="btn-next">Próximo passo</button>
                        </div>
                    </div>

                    <div class="form-step" id="step-3">
                        <div class="input-row">
                            <div class="input-group">
                                <label for="cep">CEP</label>
                                <input type="text" id="cep" placeholder="00000-000" maxlength="9" required>
                            </div>
                            <div class="input-group flex-3">
                                <label for="logradouro">Logradouro</label>
                                <input type="text" id="logradouro" placeholder="Rua, Avenida..." required>
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="input-group flex-1">
                                <label for="numero">Número</label>
                                <input type="text" id="numero" placeholder="Nº" required>
                            </div>
                            <div class="input-group flex-3">
                                <label for="bairro">Bairro</label>
                                <input type="text" id="bairro" placeholder="Seu bairro" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="complemento">Complemento (Opcional)</label>
                            <input type="text" id="complemento" placeholder="Apto, Bloco, Casa...">
                        </div>

                        <div class="input-row">
                            <div class="input-group flex-3">
                                <label for="cidade">Cidade</label>
                                <input type="text" id="cidade" placeholder="Sua cidade" required>
                            </div>
                            <div class="input-group flex-1">
                                <label for="estado">UF</label>
                                <input type="text" id="estado" placeholder="UF" maxlength="2" required>
                            </div>
                        </div>

                        <div class="terms">
                            <input type="checkbox" id="termos" required>
                            <label for="termos">Li e concordo com os <a href="../termos/index.html" class="link-termos">Termos de Uso</a> e <a href="../termos/index.html" class="link-termos">Privacidade</a>.</label>
                        </div>

                        <div class="step-actions">
                            <button type="button" class="btn-prev">Voltar</button>
                            <button type="button" class="btn-submit" id="btn-finalizar-cadastro">Cadastrar</button>
                        </div>
                    </div>
                </form>

                <p class="login-link">
                    Já possui conta? <a href="../login/index.html">Entrar</a>
                </p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
