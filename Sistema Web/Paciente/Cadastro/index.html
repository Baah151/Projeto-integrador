<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Luana Damazio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="left-side">
            <div class="overlay"></div>
            <div class="content">
                <h1>Bem-vindo(a)</h1>
                <p>
                    Crie sua conta para agendar consultas,
                    acompanhar atendimentos e cuidar da sua
                    saúde com mais praticidade.
                </p>
            </div>
        </div>

        <div class="right-side">
            <form class="register-form">
                <h2>Criar Conta</h2>

                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="input-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="exemplo@email.com" required>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="telefone">Telefone / WhatsApp</label>
                        <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>
                    </div>
                    <div class="input-group">
                        <label for="nascimento">Data de Nascimento</label>
                        <input type="date" id="nascimento" required>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="Digite uma senha" minlength="6" required>
                    </div>
                    <div class="input-group">
                        <label for="confirmar-senha">Confirmar Senha</label>
                        <input type="password" id="confirmar-senha" placeholder="Repita a senha" required>
                    </div>
                </div>

                <div class="terms">
                    <input type="checkbox" id="termos" required>
                    <label for="termos">Li e concordo com os <a href="#">Termos de Uso</a> e <a href="#">Privacidade</a>.</label>
                </div>

                <button type="submit">Cadastrar</button>

                <p class="login-link">
                    Já possui conta? <a href="../login/index.html">Entrar</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
