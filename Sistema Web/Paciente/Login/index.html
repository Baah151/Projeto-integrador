<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Luana Damazio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2 family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <div class="left-side">
            <div class="overlay"></div>
            <div class="content">
                <div class="logo">
                    <img src="../assets/logoluana.jpeg" alt="Logo Luana Damazio">
                </div>
                <h1>Olá novamente!</h1>
                <p>
                    Entre na sua conta para acompanhar suas consultas, atendimentos e cuidar da sua saúde.
                </p>
            </div>
        </div>

        <div class="right-side">
            <form class="login-form">
                <h2>Entrar</h2>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <div class="password-wrapper">
                        <input type="password" id="senha" placeholder="Digite sua senha" required>
                        <button type="button" id="togglePassword" class="toggle-button">
                            <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
                        </button>
                    </div>
                </div>

                <div class="options">
                    <div class="remember">
                        <input type="checkbox" id="remember-me">
                        <label for="remember-me">Lembrar-me</label>
                    </div>
                    <a href="../esqueceu-senha/index.html" class="forgot-link">Esqueceu a senha?</a>
                </div>

                <button type="submit">Entrar</button>

                <p class="register-link">
                    Ainda não possui conta? <a href="../cadastro/index.html">Criar conta</a>
                </p>
            </form>
        </div>
    </div>

    <script src="../assets/api.js"></script>
    <script src="script.js"></script>
</body>
</html>
