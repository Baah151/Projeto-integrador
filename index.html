<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luana Damazio - Fisioterapia & Pilates</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const agendarWhatsApp = () => {
        const numero = "554899489919"; 
        const mensagem = "Olá, gostaria de agendar uma consulta.";
        window.open(`https://api.whatsapp.com/send?phone=${numero}&text=${encodeURIComponent(mensagem)}`, '_blank');
      };

      return (
        <div>
          {/* CABEÇALHO */}
          <header className="cabecalho">
            <div className="logo">
              {/* Coloque o nome exato do arquivo da imagem salvo na sua pasta */}
              <img src="logoluana.jpeg" alt="Logo Luana Damazio" />
              </div>
            {/* Correção: class para className */}
            <nav className="menu"> 
               <ul>
                <li><a href="#inicio">Início</a></li>
                <li><a href="#servicos">Serviços</a></li>
                <li><a href="#sobre">Sobre Nós</a></li>
                <li><a href="#contato">Contato</a></li>
                </ul>
             </nav>
          </header>

          <section id="inicio" className="banner-fisioterapia">
            <div className="conteudo-texto">
              <h1>Cuide do seu corpo com leveza</h1>
              <p>Fisioterapia e Pilates para melhorar sua qualidade de vida, aliviar dores e fortalecer seu corpo.</p>
              <a 
                href="https://wa.me/554899489919?text=Ol%C3%A1%2C%20gostaria%20de%20agendar%20uma%20consulta." 
                target="_blank" 
                rel="noopener noreferrer" 
                className="btn-agendar"
              >
                Agendar consulta
              </a>
            </div>
            <div className="conteudo-imagem">
              <img src="https://blog.coegoiania.com.br/wp-content/uploads/2025/09/Tipos-De-Fisioterapia-780x470.webp" alt="Pessoa fazendo fisioterapia" />
            </div>
          </section>

          {/* BENEFÍCIOS / SOBRE NÓS - ADICIONADO id="sobre" */}
          <section id="sobre" className="container">
            <div className="beneficios">
              <div className="beneficio">
                <div className="icone">⏰</div>
                <h3>Horários Flexíveis</h3>
                <p>Atendimento de segunda a sábado, com horários das 7h às 20h</p>
              </div>
              <div className="beneficio">
                <div className="icone">👤</div>
                <h3>Profissionais Certificados</h3>
                <p>Equipe altamente qualificada e com vasta experiência</p>
              </div>
              <div className="beneficio">
                <div className="icone">📍</div>
                <h3>Localização Privilegiada</h3>
                <p>Fácil acesso, estacionamento gratuito e transporte público</p>
              </div>
            </div>
          </section>

          {/* SERVIÇOS - ADICIONADO id="servicos" */}
          <section id="servicos" className="servicos container">
            <h2>Nossos Serviços</h2>
            <p className="subtitulo">Oferecemos diversos tipos de tratamento fisioterapêutico</p>
            
            <div className="grid-servicos">
              <div className="card-servico">
                <div className="icone">🦴</div>
                <h3>Fisioterapia Ortopédica</h3>
                <p>Tratamento de lesões musculoesqueléticas, fraturas e pós-operatório.</p>
              </div>
              <div className="card-servico">
                <div className="icone">🏃</div>
                <h3>Fisioterapia Esportiva</h3>
                <p>Prevenção e reabilitação de lesões relacionadas à prática esportiva.</p>
              </div>
              <div className="card-servico">
                <div className="icone">🧘</div>
                <h3>RPG - Reeducação Postural</h3>
                <p>Correção de desvios posturais e alívio de dores crônicas.</p>
              </div>
              <div className="card-servico">
                <div className="icone">🧠</div>
                <h3>Fisioterapia Neurológica</h3>
                <p>Tratamento de condições neurológicas como AVC e Parkinson.</p>
              </div>
            </div>
          </section>

          {/* CTA FINAL / CONTATO - ADICIONADO id="contato" */}
          <section id="contato" className="container">
            <div className="cta">
              <h2>Pronto para Cuidar da Sua Saúde?</h2>
              <p>Agende sua consulta agora mesmo e comece sua jornada de recuperação</p>
              <button className="btn-cta" onClick={agendarWhatsApp}>📅 Agendar Agora</button>
            </div>
          </section>

          {/* RODAPÉ */}
          <footer className="container">
            <p>Atendimento personalizado focado na sua recuperação, bem-estar e qualidade de vida.</p>
            <p>WhatsApp: (48) 99489-9919 | Instagram: @luuanadamazio</p>
            <p>© 2026 Luana Damazio. Todos os direitos reservados.</p>
          </footer>

          {/* BOTÃO FLUTUANTE WHATSAPP */}
          <div className="whatsapp" onClick={agendarWhatsApp} style={{ cursor: 'pointer', background: 'transparent', padding: 0, boxShadow: 'none' }}>
            <img 
              src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" 
              alt="Falar no WhatsApp" 
              style={{ width: '60px', height: '60px', display: 'block' }} 
            />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
