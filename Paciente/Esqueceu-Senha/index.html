<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha | Luana Damazio</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">

        <div class="card">
            <div class="logo">
                <img src="../assets/logoluana.jpeg" alt="Logo Luana Damazio">
            </div>

            <h1>Recuperar Senha</h1>
            <p>
                Informe seu e-mail cadastrado. Enviaremos um link 
                com as instruções para você criar uma nova senha.
            </p>

            <form class="recovery-form">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="exemplo@email.com" 
                        required
                    >
                </div>

                <button type="submit">Enviar Link de Recuperação</button>
            </form>

            <a href="../login/index.html" class="back-link">
                Voltar para o Login
            </a>
        </div>

    </div>

</body>
</html>
