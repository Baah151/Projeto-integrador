<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil | Luana Damazio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <img src="../assets/logoluana.jpeg" alt="Logo">
            </div>
            <nav>
                <a href="../agendamento/index.html">
                    <span class="material-symbols-outlined">calendar_add_on</span> Agendamento
                </a>
                <a href="../minhas-consultas/index.html">
                    <span class="material-symbols-outlined">event_note</span> Minhas Consultas
                </a>
                <a href="../documentos/index.html">
                    <span class="material-symbols-outlined">folder_shared</span> Documentos
                </a>
                <a href="../financeiro/index.html">
                    <span class="material-symbols-outlined">payments</span> Financeiro
                </a>
                <a href="../histórico/index.html">
                    <span class="material-symbols-outlined">history</span> Histórico
                </a>
                <a href="../perfil/index.html" class="active">
                    <span class="material-symbols-outlined">person</span> Perfil
                </a>
            </nav>
            <div class="logout">
                <a href="../login/index.html">Sair</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <h1>Meu Perfil</h1>
                <p>Mantenha seus dados de contato atualizados.</p>
            </div>

            <div class="profile-card">
                <form class="profile-form">
                    
                    <div class="profile-header">
                        <div class="avatar-container">
                            <img src="../assets/user-placeholder.png" alt="Foto de Perfil" id="profile-img">
                            <label for="upload-photo" class="upload-badge">📷</label>
                            <input type="file" id="upload-photo" accept="image/*" style="display:none;">
                        </div>
                        <div class="header-text">
                            <h3>Nome do Paciente</h3>
                            <p>Paciente da clínica</p>
                        </div>
                    </div>

                    <div class="form-section">
                        <h4>Dados de Registro</h4>
                        <div class="input-row">
                            <div class="input-group">
                                <label>Nome Completo</label>
                                <input type="text" value="Nome vindo do Cadastro" disabled class="disabled-input">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label>CPF</label>
                                <input type="text" value="***.***.***-**" disabled class="disabled-input">
                            </div>
                            <div class="input-group">
                                <label>Data de Nascimento</label>
                                <input type="text" value="00/00/0000" disabled class="disabled-input">
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h4>Dados de Contato e Acesso</h4>
                        <div class="input-row">
                            <div class="input-group">
                                <label>E-mail</label>
                                <input type="email" placeholder="exemplo@email.com" required>
                            </div>
                            <div class="input-group">
                                <label>Telefone / WhatsApp</label>
                                <input type="tel" placeholder="(00) 00000-0000" required>
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label>Nova Senha</label>
                                <input type="password" placeholder="Digite nova senha">
                            </div>
                            <div class="input-group">
                                <label>Confirmar Nova Senha</label>
                                <input type="password" placeholder="Repita a nova senha">
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-save">Salvar Alterações</button>
                    </div>

                </form>
            </div>
        </main>
    </div>

</body>
</html>
